<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URX22 MIX オン/オフ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0f;
      --panel: #151517;
      --panel-2: #1c1c1f;
      --line: #2b2b30;
      --line-strong: #3c3c42;
      --text: #f4f4f5;
      --muted: #9a9aa1;
      --radius: 10px;
      accent-color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { padding: 14px; display: grid; gap: 14px; }
    .section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .section h2 {
      margin: 0 0 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 10px; align-items: center; }
    .row > label { color: var(--muted); font-size: 12px; }
    select {
      width: 100%;
      padding: 7px 9px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font: inherit;
    }
    .hint { color: var(--muted); font-size: 11px; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="section">
      <h2>URX22</h2>
      <div class="row">
        <label for="mix">対象</label>
        <select id="mix">
          <option value="1">MIX1</option>
          <option value="2">MIX2</option>
        </select>
      </div>
      <p class="hint">
        キーを押すたびに選んだ MIX をオン・オフします。オフのときがミュートです。
        いまの状態は機器から読み取れないため、このプラグインが最後に切り替えた状態を表示します（最初の一回はオフにします）。
      </p>
      <p class="hint">
        Yamaha Device Center が起動していると切り替えられません。最後に押してから 1 分たつと接続を手放すので、そのあとは Device Center を使えます。
      </p>
    </div>
  </div>

  <script>
    const state = { websocket: null, context: null, settings: {} };

    const $mix = document.getElementById("mix");

    function save() {
      const mix = $mix.value === "2" ? 2 : 1;
      const next = Object.assign({}, state.settings, { mix });
      // The remembered on/off belongs to the bus it was set on; carrying it to
      // the other bus would show that bus in a state nobody set.
      if (mix !== (Number(state.settings.mix) === 2 ? 2 : 1)) {
        delete next.lastOn;
      }
      state.settings = next;
      if (!state.websocket || state.websocket.readyState !== WebSocket.OPEN || !state.context) return;
      state.websocket.send(JSON.stringify({
        event: "setSettings",
        context: state.context,
        payload: state.settings,
      }));
    }

    function applySettings(settings) {
      state.settings = settings || {};
      $mix.value = Number(state.settings.mix) === 2 ? "2" : "1";
    }

    $mix.addEventListener("change", save);

    function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
      state.context = inPluginUUID;
      try {
        const info = typeof inActionInfo === "string" ? JSON.parse(inActionInfo) : inActionInfo;
        if (info && info.payload && info.payload.settings) {
          state.settings = info.payload.settings;
        }
      } catch (error) {
        // Fall back to the getSettings round-trip below.
      }
      applySettings(state.settings);

      state.websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
      state.websocket.onopen = () => {
        state.websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPluginUUID }));
        state.websocket.send(JSON.stringify({ event: "getSettings", context: inPluginUUID }));
      };

      state.websocket.onmessage = (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch (error) {
          return;
        }
        if (message.event === "didReceiveSettings") {
          applySettings(message.payload && message.payload.settings);
        }
      };
    }

    window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
  </script>
</body>
</html>
